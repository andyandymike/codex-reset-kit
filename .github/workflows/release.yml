name: Release npm package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CODEX_RESET_KIT_TEST_MODE: "1"
    steps:
      - name: Check out the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js without dependency caching
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Require a matching version tag on main
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "${expected}"
          git fetch origin main --no-tags
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Audit high-severity dependency advisories
        run: npm run audit
      - name: Run all checks and package smoke tests without publish credentials
        run: |
          npm run check
          npm run package:smoke
      - name: Build the immutable npm tarball
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          npm pack --ignore-scripts --pack-destination release
          mapfile -t tarballs < <(find release -maxdepth 1 -type f -name '*.tgz' -print)
          test "${#tarballs[@]}" -eq 1
          sha256sum "${tarballs[0]}" > release/SHA256SUMS
      - name: Upload the verified release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release
          path: release/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require an explicitly provisioned release environment
        shell: bash
        env:
          NPM_RELEASE_GUARD: ${{ vars.NPM_RELEASE_GUARD }}
        run: test "${NPM_RELEASE_GUARD}" = "protected-v1"
      - name: Download the verified release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release
          path: release
      - name: Set up npm Trusted Publishing
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify and publish the exact reviewed tarball
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check release/SHA256SUMS
          mapfile -t tarballs < <(find release -maxdepth 1 -type f -name '*.tgz' -print)
          test "${#tarballs[@]}" -eq 1
          tarball="${tarballs[0]}"
          tar -xOf "$tarball" package/package.json | node -e '
            const fs = require("node:fs");
            const value = JSON.parse(fs.readFileSync(0, "utf8"));
            const expected = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            if (value.name !== "codex-reset-kit" || value.version !== expected) process.exit(1);
          '
          npm publish "$tarball" --ignore-scripts
